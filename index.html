<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NaraaAi ChatAI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #000000;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0;
        }

        .chat-container {
            background: #0a0a0a;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            flex-shrink: 0;
            background: #111111;
            color: white;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
            position: relative;
            border-bottom: 1px solid #222222;
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background: #0a0a0a;
        }

        .input-area {
            flex-shrink: 0;
            padding: 20px;
            background: #1a1a1a;
            border-top: 1px solid #333333;
            display: flex;
            gap: 10px;
        }

        .footer-credit {
            flex-shrink: 0;
            padding: 10px 20px;
            text-align: center;
            color: #555555;
            font-size: 11px;
            font-style: italic;
            transform: skewX(-8deg);
            background: #0a0a0a;
            font-weight: 300;
            letter-spacing: 0.3px;
            border-top: 1px solid #1a1a1a;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
        }

        .status-bar {
            display: none;
        }

        .header-center {
            text-align: center;
            flex: 1;
        }

        .chat-header h1 {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .chat-header p {
            font-size: 13px;
            opacity: 0.9;
            margin-top: 4px;
            font-weight: 400;
        }

        .header-right {
            display: none;
        }

        .ai-profile {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(50, 50, 50, 0.3);
            padding: 8px 12px;
            border-radius: 8px;
            backdrop-filter: blur(10px);
        }

        .ai-avatar-img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid white;
        }

        .ai-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .ai-name {
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
        }

        .online-status {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            font-weight: 500;
        }

        .online-dot {
            width: 8px;
            height: 8px;
            background: #666666;
            border-radius: 50%;
            animation: dotPulse 2s ease-in-out infinite;
        }

        @keyframes dotPulse {
            0%, 100% {
                opacity: 1;
                box-shadow: 0 0 8px #666666;
            }
            50% {
                opacity: 0.5;
                box-shadow: 0 0 3px #666666;
            }
        }

        .message {
            display: flex;
            gap: 12px;
            animation: bubbleIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes bubbleIn {
            from {
                opacity: 0;
                transform: scale(0.8) translateY(10px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .message.user {
            justify-content: flex-end;
        }

        .message-content {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 12px;
            word-wrap: break-word;
            line-height: 1.5;
        }

        .message.user .message-content {
            background: #1a1a1a;
            color: #ffffff;
            border: 1px solid #333333;
            border-bottom-right-radius: 4px;
        }

        .message.assistant .message-content {
            background: #1a1a1a;
            color: #cccccc;
            border: 1px solid #333333;
            border-bottom-left-radius: 4px;
        }

        .message-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .message.user .message-avatar {
            background: #333333;
            color: white;
            order: 2;
        }

        .message.assistant .message-avatar {
            background: #1a1a1a;
            color: #cccccc;
            border: 1px solid #333333;
        }

        .loading-dots {
            display: inline-flex;
            gap: 4px;
            margin-top: 5px;
        }

        .loading-dots span {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #666666;
            animation: bounce 1.4s infinite;
        }

        .loading-dots span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .loading-dots span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes bounce {
            0%, 80%, 100% {
                opacity: 0.3;
            }
            40% {
                opacity: 1;
            }
        }

        #messageInput {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #444444;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            resize: none;
            max-height: 100px;
            min-height: 44px;
            background: #2a2a2a;
            color: #ffffff;
        }

        #messageInput::placeholder {
            color: #777777;
        }

        #messageInput:focus {
            outline: none;
            border-color: #666666;
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.05);
        }

        #sendBtn {
            padding: 12px 24px;
            background: #2a2a2a;
            color: #999999;
            border: 1px solid #444444;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            min-width: 80px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #sendBtn:hover:not(:disabled) {
            background: #333333;
            color: #cccccc;
            border-color: #555555;
        }

        #sendBtn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .error-message {
            background: #2a1a1a;
            color: #999999;
            padding: 12px 16px;
            border-radius: 8px;
            margin: 10px 20px;
            border-left: 4px solid #555555;
        }

        .info-message {
            text-align: center;
            color: #888;
            padding: 20px;
        }

        .suggested-prompts {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
            align-content: center;
            justify-items: center;
            width: 100%;
        }

        .prompt-card {
            background: #1a1a1a;
            border: 1px solid #333333;
            border-radius: 12px;
            padding: 16px 24px;
            cursor: pointer;
            transition: all 0.3s ease;
            color: #cccccc;
            font-size: 15px;
            font-weight: 500;
            text-align: center;
            width: 100%;
            max-width: 300px;
        }

        .prompt-card:hover {
            background: #252525;
            border-color: #444444;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }

        .prompt-card:active {
            transform: translateY(0);
        }

        /* Scrollbar Styling */
        .messages-container::-webkit-scrollbar {
            width: 6px;
        }

        .messages-container::-webkit-scrollbar-track {
            background: #0a0a0a;
        }

        .messages-container::-webkit-scrollbar-thumb {
            background: #333333;
            border-radius: 3px;
        }

        .messages-container::-webkit-scrollbar-thumb:hover {
            background: #555555;
        }

        @media (max-width: 600px) {
            .chat-container {
                height: 100vh;
                max-width: 100%;
                border-radius: 0;
            }

            .message-content {
                max-width: 85%;
            }
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <div class="header-left">
                <div class="ai-profile">
                    <img id="aiAvatarImg" src="" alt="AI Avatar" class="ai-avatar-img">
                    <div class="ai-info">
                        <div class="ai-name" id="aiName">NaraaAi</div>
                        <div class="online-status">
                            <div class="online-dot"></div>
                            <span>Online</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="header-center">
                <h1>NaraaAi</h1>
                <p>Powered by KyuuTechOfficial</p>
            </div>

            <div class="header-right">
            </div>
        </div>

        <div class="messages-container" id="messagesContainer">
            <div class="suggested-prompts" id="suggestedPrompts">
                <div class="prompt-card" onclick="selectPrompt('Tanya Soal Matematika')">Tanya Soal Matematika</div>
                <div class="prompt-card" onclick="selectPrompt('Tanya Soal Coding')">Tanya Soal Coding</div>
                <div class="prompt-card" onclick="selectPrompt('Tanya Seputar Dunia')">Tanya Seputar Dunia</div>
            </div>
        </div>

        <div class="input-area">
            <textarea 
                id="messageInput" 
                placeholder="Ketik pesan Anda di sini..."
                rows="1"
            ></textarea>
            <button id="sendBtn">↑</button>
        </div>

        <div class="footer-credit">
            Developed By KyuuTech 2026
        </div>
    </div>

    <script>
        // ⚠️ KONFIGURASI API - ISI SESUAI KEBUTUHAN
        const API_KEY = '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'; // Ganti dengan API key Anda
        const API_URL = 'https://openrouter.ai/api/v1/chat/completions'; // Ganti URL API
        const MODEL = 'gpt-4o'; // Ganti model yang digunakan
        
        // Konfigurasi AI Profile (opsional)
        const AI_NAME = 'NaraaAi';
        const AI_AVATAR_URL = 'https://files.catbox.moe/7wsq2b.jpg';

        const messagesContainer = document.getElementById('messagesContainer');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const aiNameEl = document.getElementById('aiName');
        const aiAvatarImg = document.getElementById('aiAvatarImg');
        
        let conversationHistory = [];

        // Set AI Profile
        aiNameEl.textContent = AI_NAME;
        if (AI_AVATAR_URL) {
            aiAvatarImg.src = AI_AVATAR_URL;
        }

        function selectPrompt(prompt) {
            messageInput.value = prompt;
            messageInput.focus();
            sendMessage();
        }

        function removeSuggestedPrompts() {
            const suggestedSection = document.getElementById('suggestedPrompts');
            if (suggestedSection) {
                suggestedSection.remove();
            }
        }

        messageInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 100) + 'px';
        });

        messageInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        sendBtn.addEventListener('click', sendMessage);

        async function sendMessage() {
            const message = messageInput.value.trim();
            
            if (!message) return;

            if (API_KEY.includes('YOUR_API_KEY')) {
                showError('Error: API key tidak dikonfigurasi. Hubungi administrator.');
                return;
            }

            messageInput.value = '';
            messageInput.style.height = 'auto';
            removeSuggestedPrompts();

            const infoMsg = messagesContainer.querySelector('.info-message');
            if (infoMsg) infoMsg.remove();

            addMessageToDisplay(message, 'user');

            conversationHistory.push({
                role: 'user',
                content: message
            });

            const loadingId = showLoading();

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${API_KEY}`
                    },
                    body: JSON.stringify({
                        model: MODEL,
                        messages: conversationHistory,
                        max_tokens: 1024,
                        temperature: 0.7
                    })
                });

                removeLoading(loadingId);

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error?.message || 'API Error');
                }

                const data = await response.json();
                const assistantMessage = data.choices[0].message.content;

                addMessageToDisplay(assistantMessage, 'assistant');

                conversationHistory.push({
                    role: 'assistant',
                    content: assistantMessage
                });

            } catch (error) {
                removeLoading(loadingId);
                showError(`Error: ${error.message}`);
                conversationHistory.pop();
            }

            messageInput.focus();
        }

        function addMessageToDisplay(text, role) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;

            const avatar = document.createElement('div');
            avatar.className = 'message-avatar';
            avatar.textContent = role === 'user' ? 'YOU' : 'AI';

            const content = document.createElement('div');
            content.className = 'message-content';
            content.textContent = text;

            messageDiv.appendChild(avatar);
            messageDiv.appendChild(content);
            messagesContainer.appendChild(messageDiv);

            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function showLoading() {
            const loadingId = Date.now();
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message assistant';
            messageDiv.id = `loading-${loadingId}`;

            const avatar = document.createElement('div');
            avatar.className = 'message-avatar';
            avatar.textContent = 'AI';

            const content = document.createElement('div');
            content.className = 'message-content';
            content.innerHTML = '<div class="loading-dots"><span></span><span></span><span></span></div>';

            messageDiv.appendChild(avatar);
            messageDiv.appendChild(content);
            messagesContainer.appendChild(messageDiv);

            messagesContainer.scrollTop = messagesContainer.scrollHeight;
            return loadingId;
        }

        function removeLoading(loadingId) {
            const loadingEl = document.getElementById(`loading-${loadingId}`);
            if (loadingEl) loadingEl.remove();
        }

        function showError(message) {
            const errorDiv = document.createElement('div');
            errorDiv.className = 'error-message';
            errorDiv.textContent = message;
            messagesContainer.appendChild(errorDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }
    </script>
</body>
  </html>
